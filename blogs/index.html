<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M2ZPicks Blogs</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .blogs-hero{padding:28px 0 8px}.blogs-hero h1{font-size:40px;line-height:1.1;margin-bottom:8px}.blogs-hero p{color:var(--tx2)}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{padding:7px 13px;border:1px solid rgba(255,255,255,.2);border-radius:999px;font-size:12.5px;font-weight:600;color:#e6e7ff;background:rgba(255,255,255,.05);cursor:pointer}.chip.active,.chip:hover{background:linear-gradient(135deg,#5f49ff,#26c7b3);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(95,73,255,.35)}
    .featured{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:20px;border:1px solid var(--bd-hi);border-radius:16px;background:linear-gradient(135deg,rgba(108,92,231,.12),rgba(0,203,169,.06))}
    .featured img{width:100%;height:280px;object-fit:cover;border-radius:12px}.meta{font-size:12px;color:var(--tx2)} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .blog-card{padding:16px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.02)} .blog-card h3{font-size:20px;line-height:1.25;margin:6px 0 8px}
    .search-wrap{margin:14px 0 18px}.search-wrap input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:#0b0b14;color:var(--tx)}
    @media (max-width:980px){.featured{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}@media (max-width:640px){.grid3{grid-template-columns:1fr}.blogs-hero h1{font-size:30px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="container nav-wrap"><a href="../index.html" class="logo"><span class="logo-mark">✦</span><span class="logo-text">M2ZPicks</span></a><nav class="main-nav" id="mainNav" aria-label="Main Navigation"><a href="../index.html">Home</a><a href="../list.html">Browse Tools</a><a href="../creators.html">Creator Picks</a><a href="../rankings.html">AI Rankings</a><a href="index.html" class="active">Blogs</a></nav><div class="nav-actions"><a href="../list.html" class="btn btn-nav">Start Exploring</a></div></div></header>
  <main class="container section">
    <section class="blogs-hero"><h1>AI Blogs That Are Actually Useful</h1><p>Actionable reviews, comparisons, rankings, guides, updates, and alternatives.</p></section>
    <div class="search-wrap"><input id="blogSearch" type="search" placeholder="Search blogs by title or excerpt..." /></div>
    <div class="chip-row" id="categoryChips"></div>
    <section id="latestBlog" style="margin:10px 0 24px;"></section>
    <section><div class="section-head"><h2>All Posts</h2></div><div class="grid3" id="allBlogs"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@16/dist/iife/sdk.js"></script><script src="../appwrite.js"></script><script src="landing.js"></script>
</body>
</html>
